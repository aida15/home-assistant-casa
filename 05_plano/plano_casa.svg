<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 860 1000" width="860" height="1000" role="img" aria-label="Plano de la vivienda">
  <!--
    Plano de la vivienda · v0.3 (2026-10-19)
    Trazado sobre el plano de obra aportado por Aida (escala ≈ 59 px/m). Medidas APROXIMADAS.
    Uso previsto: www/plano/ en la configuración de HA, con estados vinculados por id.
    Ids: area-<area_id> · luz-<area_id>-<nombre> · punto-luz-<area_id> · temp-<area_id>
         puerta-<area_a>-<area_b> · ventana-<area_id>-<orientacion> · cristalera-<a>-<b> · armario-<area_id>
    Colores por variables CSS con valores de reserva del tema de día.
    PRIVADO: no publicar (D-003).
  -->
  <style>
    .cesped     { fill: var(--plano-cesped, #DCE3D2); }
    .suelo-ext  { fill: var(--plano-exterior, #E4DDD2); }
    .terraza    { fill: var(--plano-exterior, #E4DDD2); stroke: var(--plano-muro-suave, #CFC5B8); stroke-width: 2; stroke-dasharray: 6 6; }
    .estancia   { fill: var(--plano-suelo, #FBF9F6); stroke: var(--plano-muro, #8A8178); stroke-width: 5; stroke-linejoin: round; }
    .estancia.activa { fill: var(--plano-activa, #F3DED3); stroke: var(--acento, #B04F2C); }
    .armario    { fill: var(--plano-mueble, #EEE8DF); stroke: var(--plano-muro-suave, #CFC5B8); stroke-width: 1.5; }
    .ventana    { stroke: var(--plano-ventana, #8FA8B6); stroke-width: 8; stroke-linecap: butt; }
    .cristalera { stroke: var(--plano-ventana, #8FA8B6); stroke-width: 5; stroke-linecap: butt; }
    .puerta     { stroke: var(--plano-puerta, #B59878); stroke-width: 8; stroke-linecap: butt; }
    .puerta.abierta, .ventana.abierta { stroke: var(--acento, #B04F2C); }
    .rotulo     { font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: var(--plano-texto, #655D54); }
    .rotulo.activa { fill: var(--acento-texto, #93401F); font-weight: 700; }
    .rotulo-ext { font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 500; fill: var(--plano-texto-suave, #7D756B); }
    .temp       { font-family: Figtree, 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 600; fill: var(--plano-texto, #655D54); font-variant-numeric: tabular-nums; }
    .punto-luz  { fill: none; stroke: var(--plano-muro-suave, #B8AE9F); stroke-width: 2.5; }
    .luz circle { fill: var(--plano-suelo, #FBF9F6); stroke: var(--plano-muro-suave, #B8AE9F); stroke-width: 2.5; }
    .luz path   { fill: none; stroke: var(--plano-texto, #655D54); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .luz.on circle { fill: var(--acento, #B04F2C); stroke: var(--acento, #B04F2C); }
    .luz.on path   { stroke: var(--acento-sobre, #FFFFFF); }
    .luz.no-disponible circle { stroke-dasharray: 5 5; }
  </style>

  <!-- Exteriores -->
  <path id="area-jardin-cesped" class="cesped" d="M250 35 H825 V205 H362 V133 H250 Z"/>
  <path id="area-jardin-suelo" class="suelo-ext" d="M690 215 H830 V700 Q830 880 690 880 Z"/>
  <rect id="area-jardin-terraza_1" class="suelo-ext" x="570" y="215" width="115" height="250"/>
  <rect id="area-terraza" class="terraza" x="30" y="874" width="300" height="146"/>

  <!-- Estancias -->
  <rect id="area-cuarto_de_limpieza" class="estancia" x="221" y="153" width="136" height="90"/>
  <rect id="area-cocina" class="estancia" x="221" y="248" width="136" height="242"/>
  <rect id="area-entrada" class="estancia" x="222" y="495" width="140" height="137"/>
  <rect id="area-sala" class="estancia activa" x="362" y="225" width="203" height="345"/>
  <rect id="area-pasillo" class="estancia" x="362" y="575" width="203" height="65"/>
  <rect id="area-bano_aroa" class="estancia" x="570" y="470" width="115" height="170"/>
  <rect id="area-bano_darlings" class="estancia" x="30" y="605" width="150" height="95"/>
  <path id="area-habitacion_darlings" class="estancia" d="M180 640 H285 V860 H30 V700 H180 Z"/>
  <rect id="area-estudio" class="estancia" x="285" y="640" width="177" height="220"/>
  <rect id="area-habitacion_aroa" class="estancia" x="467" y="640" width="201" height="220"/>

  <!-- Armarios -->
  <rect id="armario-habitacion_darlings" class="armario" x="250" y="706" width="31" height="126"/>
  <rect id="armario-estudio" class="armario" x="290" y="645" width="110" height="26"/>
  <rect id="armario-habitacion_aroa" class="armario" x="532" y="645" width="132" height="26"/>

  <!-- Ventanas y cristaleras -->
  <line id="ventana-cuarto_de_limpieza-norte" class="ventana" x1="225" y1="153" x2="353" y2="153"/>
  <line id="cristalera-cocina-cuarto_de_limpieza" class="cristalera" x1="224" y1="245" x2="298" y2="245"/>
  <line id="ventana-sala-norte" class="ventana" x1="370" y1="225" x2="558" y2="225"/>
  <line id="ventana-sala-este" class="ventana" x1="565" y1="232" x2="565" y2="404"/>
  <line id="ventana-bano_aroa-este" class="ventana" x1="685" y1="560" x2="685" y2="605"/>
  <line id="ventana-habitacion_darlings-sur" class="ventana" x1="75" y1="860" x2="220" y2="860"/>
  <line id="ventana-estudio-sur" class="ventana" x1="335" y1="860" x2="445" y2="860"/>
  <line id="ventana-habitacion_aroa-sur" class="ventana" x1="480" y1="860" x2="650" y2="860"/>

  <!-- Puertas -->
  <line id="puerta-principal" class="puerta" x1="222" y1="500" x2="222" y2="555"/>
  <line id="puerta-sala-terraza_1" class="puerta" x1="565" y1="410" x2="565" y2="462"/>
  <line id="puerta-cuarto_de_limpieza-cocina" class="puerta" x1="300" y1="245" x2="350" y2="245"/>
  <line id="puerta-cocina-entrada" class="puerta" x1="258" y1="492" x2="308" y2="492"/>
  <line id="puerta-entrada-sala" class="puerta" x1="362" y1="505" x2="362" y2="558"/>
  <line id="puerta-entrada-pasillo" class="puerta" x1="362" y1="585" x2="362" y2="630"/>
  <line id="puerta-entrada-habitacion_darlings" class="puerta" x1="226" y1="636" x2="272" y2="636"/>
  <line id="puerta-pasillo-estudio" class="puerta" x1="410" y1="640" x2="458" y2="640"/>
  <line id="puerta-pasillo-habitacion_aroa" class="puerta" x1="472" y1="640" x2="520" y2="640"/>
  <line id="puerta-pasillo-bano_aroa" class="puerta" x1="570" y1="585" x2="570" y2="630"/>
  <line id="puerta-habitacion_darlings-bano_darlings" class="puerta" x1="180" y1="645" x2="180" y2="692"/>

  <!-- Rótulos -->
  <text class="rotulo" x="230" y="180">Limpieza</text>
  <text class="rotulo" x="230" y="275">Cocina</text>
  <text class="rotulo" x="236" y="522">Entrada</text>
  <text class="rotulo activa" x="374" y="254">Sala</text>
  <text class="rotulo" x="374" y="602" style="font-size: 16px">Pasillo</text>
  <text class="rotulo" x="580" y="496" style="font-size: 16px">Baño</text>
  <text class="rotulo" x="580" y="515" style="font-size: 16px">Aroa</text>
  <text class="rotulo" x="40" y="630">Baño</text>
  <text class="rotulo" x="40" y="728">Hab. darlings</text>
  <text class="rotulo" x="294" y="696">Estudio</text>
  <text class="rotulo" x="476" y="696">Hab. Aroa</text>
  <text class="rotulo-ext" x="680" y="80">Jardín</text>
  <text class="rotulo-ext" x="578" y="242" style="font-size: 15px">Terraza 1</text>
  <text class="rotulo-ext" x="40" y="902">Terraza</text>

  <!-- Temperaturas (zonas tado) -->
  <text id="temp-sala" class="temp" x="374" y="556">21,0°</text>
  <text id="temp-estudio" class="temp" x="294" y="846">19,8°</text>
  <text id="temp-habitacion_aroa" class="temp" x="476" y="846">20,5°</text>
  <text id="temp-habitacion_darlings" class="temp" x="40" y="846">20,1°</text>

  <!-- Puntos de luz de techo sin domotizar (referencia) -->
  <circle id="punto-luz-cuarto_de_limpieza" class="punto-luz" cx="295" cy="200" r="9"/>
  <circle id="punto-luz-entrada" class="punto-luz" cx="310" cy="555" r="9"/>
  <circle id="punto-luz-pasillo" class="punto-luz" cx="480" cy="607" r="9"/>
  <circle id="punto-luz-bano_aroa" class="punto-luz" cx="625" cy="555" r="9"/>
  <circle id="punto-luz-bano_darlings" class="punto-luz" cx="110" cy="652" r="9"/>
  <circle id="punto-luz-habitacion_darlings" class="punto-luz" cx="135" cy="772" r="9"/>
  <circle id="punto-luz-estudio" class="punto-luz" cx="370" cy="757" r="9"/>

  <!-- Luces domotizadas (ZBMINIL2) -->
  <g id="luz-sala-techo_1" class="luz on" transform="translate(465 325)"><circle r="30"/><path d="M-6 10h12M-4.5 15h9M0 -15a10.5 10.5 0 0 0-6 19c1 .9 1.8 2.1 1.8 3.6h8.4c0-1.5.8-2.7 1.8-3.6A10.5 10.5 0 0 0 0 -15z"/></g>
  <g id="luz-sala-techo_2" class="luz on" transform="translate(470 490)"><circle r="30"/><path d="M-6 10h12M-4.5 15h9M0 -15a10.5 10.5 0 0 0-6 19c1 .9 1.8 2.1 1.8 3.6h8.4c0-1.5.8-2.7 1.8-3.6A10.5 10.5 0 0 0 0 -15z"/></g>
  <g id="luz-cocina-techo" class="luz" transform="translate(295 375)"><circle r="30"/><path d="M-6 10h12M-4.5 15h9M0 -15a10.5 10.5 0 0 0-6 19c1 .9 1.8 2.1 1.8 3.6h8.4c0-1.5.8-2.7 1.8-3.6A10.5 10.5 0 0 0 0 -15z"/></g>
  <g id="luz-habitacion_aroa-techo" class="luz" transform="translate(575 757)"><circle r="30"/><path d="M-6 10h12M-4.5 15h9M0 -15a10.5 10.5 0 0 0-6 19c1 .9 1.8 2.1 1.8 3.6h8.4c0-1.5.8-2.7 1.8-3.6A10.5 10.5 0 0 0 0 -15z"/></g>
</svg>
